name: Foundry CLI

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "test/**"
      - "catalog/**"
      - "package.json"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "src/**"
      - "test/**"
      - "catalog/**"
      - "package.json"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node bin/foundry.js --help
